version: '3.8'

services:
  postgres:
    image: postgres:18.1
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - app_network
    restart: unless-stopped

  redis:
    image: redis:8.4
    container_name: redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - app_network
    restart: unless-stopped
    command: redis-server --appendonly yes

  redisinsight:
    image: redis/redisinsight:3.0.2
    container_name: redisinsight
    ports:
      - '5540:5540'
    volumes:
      - redisinsight_data:/data
    networks:
      - app_network
    restart: unless-stopped
    depends_on:
      - redis

volumes:
  postgres_data:
  redis_data:
  redisinsight_data:

networks:
  app_network:
    driver: bridge
